name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v13
      with:
        version: 'latest'

    - name: Verify Emscripten installation
      run: emcc --version

    - name: Build WebAssembly
      run: |
        chmod +x build_wasm.sh
        ./build_wasm.sh

    - name: Copy web files
      run: |
        mkdir -p public
        cp web/index.html public/
        cp web/style.css public/
        cp web/app.js public/
        cp web/dist/llm_engine.js public/
        cp web/dist/llm_engine.wasm public/

    - name: Update script path in HTML
      run: |
        sed -i 's|dist/llm_engine.js|llm_engine.js|g' public/index.html

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
